<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <title>Карта України</title>
    <link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
    <script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
    <style>
        #map {
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id='map'></div>
    <script>
        var map = L.map('map').setView([48.3794, 31.1656], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        function setMapCenter(lat, lng, zoom) {
            console.log(`setMapCenter called with: lat=${lat}, lng=${lng}, zoom=${zoom}`);
            map.setView([lat, lng], zoom);
        }

        var markers = {};

        function addMarker(lat, lng, markerKey) {
            try {
                if (markers[markerKey]) {
                    console.log(`Removing existing marker with key: ${markerKey}`);
                    map.removeLayer(markers[markerKey]);
                }

                var marker = L.marker([lat, lng]).addTo(map);
                markers[markerKey] = marker;

                console.log(`Added marker: Latitude=${lat}, Longitude=${lng}, Key=${markerKey}`);
            } catch (error) {
                console.error(`Error adding marker: ${error.message}`);
            }
        }


        function addClickMarker() {
            map.on('click', function (e) {
                var lat = e.latlng.lat;
                var lng = e.latlng.lng;

                // Лог координат
                console.log(`Координати кліку: ${lat}, ${lng}`);

                if (window.external && window.external.notify) {
                    window.external.notify(`AddManualMarker|${lat}|${lng}`);
                } else {
                    console.log("External notify is not available.");
                }
            });
        }

        //function clearAllMarkers() {
        //    if (map && markers) {
        //        markers.forEach(marker => {
        //            map.removeLayer(marker);
        //        });
        //        markers = [];
        //        console.log("All markers cleared.");
        //    }
        //}

        function clearMarkers() {
            console.log("clearMarkers function called");
            if (Object.keys(markers).length > 0) { // Перевіряємо, чи є маркери
                Object.values(markers).forEach(marker => {
                    map.removeLayer(marker); // Видаляємо маркер з карти
                });
                markers = {}; // Очищаємо об'єкт маркерів
                console.log("All markers cleared.");
            } else {
                console.log("No markers to clear.");
            }
        }


        // Виклик функції для ввімкнення натискання на карту
        addClickMarker();
    </script>
</body>
</html>
